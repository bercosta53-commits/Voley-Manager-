name: Velora | Auditoria de 80 novas contas TI
on:
  workflow_dispatch:
  push:
    branches: [research/velora-live-tags-pilot]
    paths:
      - ".github/workflows/velora-expansion-80.yml"
      - "velora_scan_live/data/velora_expansion_80.csv"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        batch: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner
        run: |
          python -m pip install -r velora_scan_live/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Prepare independent 10-company batch
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          python - <<'PY'
          import csv,os
          start=int(os.environ['BATCH'])*10
          with open('velora_scan_live/data/velora_expansion_80.csv',encoding='utf-8-sig',newline='') as f:
            allrows=list(csv.DictReader(f))
          assert len(allrows)==80,len(allrows)
          rows=allrows[start:start+10]
          with open('velora_scan_live/data/expansion_chunk.csv','w',encoding='utf-8',newline='') as f:
            writer=csv.DictWriter(f,fieldnames=['account_id','company','domain','tier'])
            writer.writeheader()
            writer.writerows(rows)
          print('Batch',os.environ['BATCH'],'accounts:',[x['account_id'] for x in rows])
          PY
      - name: Visit public pages and inspect code/network
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          python velora_scan_live/scan.py             --csv velora_scan_live/data/expansion_chunk.csv             --limit 10 --max-pages 1 --timeout-ms 10000             --output "velora_expansion_${BATCH}.json"             --output-csv "velora_expansion_${BATCH}.csv"
      - name: Upload technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velora-expansion-80-batch-${{ matrix.batch }}
          path: |
            velora_expansion_*.json
            velora_expansion_*.csv
          retention-days: 30
