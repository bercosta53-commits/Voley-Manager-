name: Velora | Maturidade v2 — calibração e UI
on:
  push:
    branches: [feat/aquisicao-maturidade-calibracao-v2]
    paths:
      - "radar_app/**"
      - ".github/workflows/velora-calibration-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: radar_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: radar_app/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Data integrity
        run: node scripts/check_maturity_data.mjs
      - name: Test v2 classification and L4 L5 operational gates
        run: node scripts/check_maturity_v2.mjs
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Desktop and mobile visual smoke
        run: |
          (npm run start -- -p 3000 >/tmp/velora-next.log 2>&1 &)
          node scripts/smoke_maturity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velora-calibration-v2-visual-review
          path: radar_app/tmp/maturity/*.png
          retention-days: 12
