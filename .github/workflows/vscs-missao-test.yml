name: VSCS mandato - testes isolados
on:
  push:
    branches: [feat/vscs-33-missao-lideranca]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s radar_app/scripts/tests -p 'test_*.py'
