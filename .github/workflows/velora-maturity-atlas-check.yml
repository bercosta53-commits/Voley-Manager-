name: Velora | Maturity Atlas CI
on:
  push:
    branches: [feat/aquisicao-maturity-atlas]
    paths:
      - "radar_app/**"
      - ".github/workflows/velora-maturity-atlas-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: radar_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: radar_app/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate data integrity
        run: node scripts/check_maturity_data.mjs
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
