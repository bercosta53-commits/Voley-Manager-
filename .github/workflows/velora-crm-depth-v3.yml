name: Velora | CRM Depth v3
on:
  push:
    branches: [feat/aquisicao-crm-depth-v3]
    paths:
      - "radar_app/**"
      - ".github/workflows/velora-crm-depth-v3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: radar_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: radar_app/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Validate acquisition data
        run: node scripts/check_maturity_data.mjs
      - name: Regression calibration v2
        run: node scripts/check_maturity_v2.mjs
      - name: Test CRM depth v3
        run: node scripts/check_crm_depth_v3.mjs
      - name: TypeScript
        run: npm run lint
      - name: Build Next.js
        run: npm run build
      - name: Playwright installation
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Desktop mobile and CRM visual smoke
        run: |
          (npm run start -- -p 3000 >/tmp/velora-next.log 2>&1 &)
          node scripts/smoke_maturity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velora-crm-depth-v3-ui-review
          path: radar_app/tmp/maturity/*.png
          retention-days: 10
