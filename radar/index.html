<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radar de Sinais</title>
    <meta name="description" content="Radar de Sinais: fila semanal de contas ABM priorizadas por ABC e sinais." />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #17202a;
        --muted: #5d6b79;
        --line: #dfe4ea;
        --accent: #2457d6;
        --accent-soft: #e8eefc;
        --good: #1c7c4d;
        --good-soft: #e3f4ea;
        --warn: #9a5b00;
        --warn-soft: #fdf0d9;
        --bad: #b42318;
        --bad-soft: #fde7e5;
        --radius: 10px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: #0f1418;
          --panel: #172026;
          --text: #e6ebef;
          --muted: #9aa8b4;
          --line: #2a3640;
          --accent: #7ea2ff;
          --accent-soft: #1f2c4a;
          --good: #6fd19c;
          --good-soft: #173526;
          --warn: #f0b85a;
          --warn-soft: #3a2c13;
          --bad: #ff8a80;
          --bad-soft: #3f1d1a;
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0f1418;
        --panel: #172026;
        --text: #e6ebef;
        --muted: #9aa8b4;
        --line: #2a3640;
        --accent: #7ea2ff;
        --accent-soft: #1f2c4a;
        --good: #6fd19c;
        --good-soft: #173526;
        --warn: #f0b85a;
        --warn-soft: #3a2c13;
        --bad: #ff8a80;
        --bad-soft: #3f1d1a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      header {
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        padding: 12px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        align-items: center;
      }
      header h1 {
        font-size: 17px;
        margin: 0 8px 0 0;
      }
      header .grow {
        flex: 1;
      }
      nav {
        display: flex;
        gap: 4px;
        padding: 8px 16px 0;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      nav button {
        border: 0;
        background: none;
        color: var(--muted);
        padding: 8px 12px;
        border-bottom: 2px solid transparent;
        cursor: pointer;
        font: inherit;
        white-space: nowrap;
      }
      nav button[aria-selected='true'] {
        color: var(--accent);
        border-bottom-color: var(--accent);
        font-weight: 600;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 16px;
      }
      section.panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 16px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 14px;
        margin: 16px 0 8px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 13px;
      }
      button,
      .btn {
        font: inherit;
        font-size: 14px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      button.link {
        border: 0;
        background: none;
        color: var(--accent);
        padding: 0;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input,
      select,
      textarea {
        font: inherit;
        font-size: 14px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 8px;
        max-width: 100%;
      }
      textarea {
        width: 100%;
        min-height: 84px;
        resize: vertical;
      }
      label.field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
        color: var(--muted);
      }
      .grid-form {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 10px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .stat {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 10px 12px;
      }
      .stat b {
        display: block;
        font-size: 22px;
      }
      .badge {
        display: inline-block;
        border-radius: 999px;
        padding: 1px 8px;
        font-size: 12px;
        font-weight: 600;
        background: var(--accent-soft);
        color: var(--accent);
        white-space: nowrap;
      }
      .badge.A {
        background: var(--good-soft);
        color: var(--good);
      }
      .badge.C {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .badge.bad {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .badge.plain {
        background: var(--bg);
        color: var(--muted);
        font-weight: 500;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px;
        margin-bottom: 10px;
      }
      .card .head {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: baseline;
      }
      .card .head strong {
        font-size: 16px;
      }
      .warn {
        color: var(--warn);
        font-size: 13px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      td.num,
      th.num {
        text-align: right;
      }
      .bar {
        height: 8px;
        background: var(--bg);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid var(--line);
      }
      .bar > span {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        color: var(--text);
        width: min(760px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        padding: 16px;
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.4);
      }
      .toast {
        position: fixed;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        background: var(--text);
        color: var(--bg);
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 14px;
        max-width: calc(100vw - 32px);
      }
      .report {
        font-size: 13px;
        background: var(--bg);
        border-radius: 8px;
        padding: 8px 12px;
        margin-top: 8px;
      }
      .empty {
        color: var(--muted);
        padding: 24px 0;
        text-align: center;
      }
      @media (max-width: 600px) {
        main {
          padding: 12px;
        }
        section.panel {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Radar de Sinais</h1>
      <label class="row small"
        >Espaço
        <select id="workspace"></select>
      </label>
      <button id="new-workspace">Novo espaço</button>
      <span class="grow"></span>
      <label class="row small"
        >Data de referência
        <input type="date" id="ref-date" />
      </label>
    </header>
    <nav id="tabs" role="tablist"></nav>
    <main id="view"></main>
    <dialog id="dialog"></dialog>
    <dialog id="confirm">
      <form method="dialog">
        <p></p>
        <div class="row" style="justify-content: flex-end">
          <button value="cancel">Cancelar</button>
          <button class="primary" value="ok">Confirmar</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
