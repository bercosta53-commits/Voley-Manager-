<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Radar de Sinais</title>
    <meta name="description" content="Radar de Sinais: fila semanal de contas ABM priorizadas por ABC e sinais." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f5f4;
        --panel: #ffffff;
        --sunken: #eef2f1;
        --text: #14212b;
        --muted: #5a6a72;
        --line: #dbe3e1;
        --accent: #0e6b6b;
        --accent-ink: #ffffff;
        --accent-soft: #dff0ee;
        --good: #1b7a4b;
        --good-soft: #e1f3e8;
        --warn: #8f5600;
        --warn-soft: #fcefd6;
        --bad: #b3261e;
        --bad-soft: #fbe6e4;
        --radius: 10px;
        --font: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: #0e1517;
          --panel: #152024;
          --sunken: #1b282d;
          --text: #e4ecee;
          --muted: #93a5ab;
          --line: #27363b;
          --accent: #5cc4bd;
          --accent-ink: #062322;
          --accent-soft: #173a3a;
          --good: #71d19c;
          --good-soft: #163426;
          --warn: #f0b85a;
          --warn-soft: #3a2c13;
          --bad: #ff8f86;
          --bad-soft: #3e1d1a;
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0e1517;
        --panel: #152024;
        --sunken: #1b282d;
        --text: #e4ecee;
        --muted: #93a5ab;
        --line: #27363b;
        --accent: #5cc4bd;
        --accent-ink: #062322;
        --accent-soft: #173a3a;
        --good: #71d19c;
        --good-soft: #163426;
        --warn: #f0b85a;
        --warn-soft: #3a2c13;
        --bad: #ff8f86;
        --bad-soft: #3e1d1a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 var(--font);
      }
      a {
        color: var(--accent);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      header {
        background: var(--panel);
        padding: 12px 16px 0;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
      }
      .topbar {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
      }
      header h1 {
        font-size: 17px;
        margin: 0 8px 0 0;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header h1 svg {
        color: var(--accent);
      }
      #today {
        font-size: 13px;
        color: var(--warn);
      }
      nav {
        max-width: 1100px;
        margin: 8px auto 0;
        display: flex;
        gap: 2px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      nav button {
        border: 0;
        border-radius: 0;
        background: none;
        color: var(--muted);
        padding: 8px 12px 10px;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
        font-weight: 500;
      }
      nav button[aria-selected='true'] {
        color: var(--text);
        border-bottom-color: var(--accent);
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      section.panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
      }
      h2 {
        font-size: 16px;
        margin: 0;
        text-wrap: balance;
      }
      h3 {
        font-size: 12px;
        margin: 16px 0 6px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      p {
        margin: 6px 0;
        max-width: 70ch;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .row.between {
        justify-content: space-between;
      }
      .grow {
        flex: 1;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 13px;
      }
      .big {
        font-size: 24px;
        font-variant-numeric: tabular-nums;
      }
      .warn {
        color: var(--warn);
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
      }
      button,
      .btn {
        font: inherit;
        font-size: 14px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        line-height: 1.3;
      }
      button:hover,
      .btn:hover {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
        font-weight: 600;
      }
      button.danger {
        color: var(--bad);
      }
      button.link {
        border: 0;
        background: none;
        color: var(--accent);
        padding: 0;
        text-align: left;
      }
      button.link.title {
        color: var(--text);
        font-weight: 600;
        font-size: 15px;
      }
      button.link.title:hover {
        color: var(--accent);
        text-decoration: underline;
      }
      button.link.danger {
        color: var(--bad);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
        border-color: var(--line);
      }
      input,
      select,
      textarea {
        font: inherit;
        font-size: 14px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 9px;
        max-width: 100%;
      }
      input[type='search'] {
        width: 100%;
        margin-top: 12px;
      }
      input.narrow {
        width: 76px;
      }
      textarea {
        width: 100%;
        resize: vertical;
      }
      label.field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
        color: var(--muted);
      }
      label.field > input,
      label.field > select,
      label.field > textarea {
        color: var(--text);
      }
      .grid-form {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 12px;
      }
      .grid-form .wide {
        grid-column: 1 / -1;
      }
      .badge {
        display: inline-block;
        border-radius: 999px;
        padding: 1px 8px;
        font-size: 12px;
        font-weight: 600;
        background: var(--accent-soft);
        color: var(--accent);
        white-space: nowrap;
      }
      .badge.A {
        background: var(--good-soft);
        color: var(--good);
      }
      .badge.C,
      .badge.warnb {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .badge.bad {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .badge.plain {
        background: var(--sunken);
        color: var(--muted);
        font-weight: 500;
      }
      .count {
        display: inline-block;
        min-width: 20px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--sunken);
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .count.alert {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        margin-top: 6px;
        background: var(--muted);
      }
      .dot.F {
        background: var(--accent);
      }
      .dot.M {
        background: transparent;
        border: 2px solid var(--accent);
      }
      .dot.N {
        background: var(--bad);
      }
      td .dot {
        margin: 0 4px 1px 0;
        vertical-align: middle;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }
      .chip {
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 13px;
      }
      .chip[aria-pressed='true'] {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 600;
      }
      /* primeiros passos */
      .steps {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .steps li {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .steps .mark {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
        background: var(--sunken);
        color: var(--muted);
      }
      .steps li.done .mark {
        background: var(--good-soft);
        color: var(--good);
      }
      .steps li.done b {
        color: var(--muted);
        font-weight: 500;
        text-decoration: line-through;
      }
      .steps li.current .mark {
        background: var(--accent);
        color: var(--accent-ink);
      }
      /* fila */
      .cards {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .card .head {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
        align-items: center;
      }
      .card .pos {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-size: 13px;
        min-width: 18px;
      }
      .signals {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .signal {
        display: flex;
        gap: 8px;
        font-size: 14px;
      }
      .actions {
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      details.more {
        border-top: 1px solid var(--line);
        padding: 8px 0;
      }
      details.more:first-child {
        border-top: 0;
      }
      details.more summary {
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
      }
      ul.plain {
        list-style: none;
        margin: 6px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      /* cadência */
      .board {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
        gap: 12px;
        align-items: start;
      }
      .column {
        background: var(--sunken);
        border-radius: var(--radius);
        padding: 12px;
      }
      .column h2 {
        font-size: 14px;
        margin-bottom: 4px;
      }
      .citem {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .citem.stale {
        border-color: var(--warn);
      }
      .citem .actions {
        padding-top: 8px;
      }
      .citem button:not(.link) {
        font-size: 13px;
        padding: 4px 10px;
      }
      .notice {
        border-color: var(--warn) !important;
        background: var(--warn-soft) !important;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      /* tabelas */
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      th.family {
        padding-top: 16px;
        color: var(--text);
      }
      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .stat {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 10px 12px;
      }
      .stat b {
        display: block;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        height: 6px;
        background: var(--sunken);
        border-radius: 999px;
        overflow: hidden;
      }
      .bar > span {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      .report {
        font-size: 13px;
        background: var(--sunken);
        border-radius: 8px;
        padding: 8px 12px;
        margin-top: 10px;
      }
      .summary li {
        font-size: 15px;
      }
      .cols li {
        font-size: 13px;
      }
      .ok {
        color: var(--good);
        font-weight: 700;
      }
      .quote {
        font-style: italic;
        margin: 2px 0 6px;
      }
      .empty {
        color: var(--muted);
        padding: 28px 8px;
        text-align: center;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        color: var(--text);
        width: min(720px, calc(100vw - 24px));
        max-height: calc(100dvh - 48px);
        padding: 18px;
      }
      dialog h2 {
        font-size: 18px;
      }
      dialog form > * + * {
        margin-top: 10px;
      }
      dialog::backdrop {
        background: rgba(8, 20, 22, 0.45);
      }
      .toast {
        position: fixed;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        background: var(--text);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 14px;
        max-width: calc(100vw - 32px);
        z-index: 20;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
      }
      @media (max-width: 600px) {
        main {
          padding: 12px 16px;
        }
        section.panel,
        .card {
          padding: 12px;
        }
        .steps li {
          grid-template-columns: 28px 1fr;
        }
        .steps li > div:last-child:not(:empty) {
          grid-column: 2;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="topbar">
        <h1>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="8.5" stroke="currentColor" stroke-width="1.5" />
            <circle cx="10" cy="10" r="4.5" stroke="currentColor" stroke-width="1.5" />
            <path d="M10 10 L16 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <circle cx="14" cy="8" r="1.4" fill="currentColor" />
          </svg>
          Radar de Sinais
        </h1>
        <label class="row small"
          ><span class="muted">Espaço</span>
          <select id="workspace" aria-label="Espaço de trabalho"></select>
        </label>
        <button id="new-workspace">Novo espaço</button>
        <span id="today"></span>
      </div>
      <nav id="tabs" role="tablist" aria-label="Seções"></nav>
    </header>
    <main id="view"></main>
    <dialog id="dialog"></dialog>
    <dialog id="confirm">
      <form method="dialog">
        <p></p>
        <div class="row" style="justify-content: flex-end">
          <button value="cancel">Cancelar</button>
          <button class="primary" value="ok">Confirmar</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
