<body><div id="app"></div>
<script>
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
window.addEventListener('error',(e)=>{
  const app=document.getElementById('app');
  if(app && !app.innerHTML.trim()){
    const msg=escapeHtml(e?.message||(e?.error&&e.error.message)||'Erro desconhecido');
    app.innerHTML='<div style="max-width:760px;margin:48px auto;padding:24px;font-family:system-ui;background:#171d22;color:#fff;border-radius:16px"><h1>Não foi possível iniciar o Volley Manager</h1><p>'+msg+'</p><p>Tente abrir esta página no Chrome ou Edge atualizado.</p></div>';
  }
});
</script>
<script type="module" src="./app.mjs"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}</script>
<script id="v16-1-boot-watchdog">
window.__vmbBootWatchdog=setTimeout(()=>{
  const app=document.getElementById('app');
  if(app && !app.innerHTML.trim()){
    app.innerHTML='<div style="max-width:720px;margin:48px auto;padding:24px;background:#171d22;color:#fff;border-radius:14px;font-family:system-ui"><h1>Volley Manager</h1><p>O carregamento foi interrompido. Reabra a página ou carregue a versão anterior novamente.</p></div>';
  }
},5000);
</script>
